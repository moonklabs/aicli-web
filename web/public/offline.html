<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 - AICode Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .offline-container {
            text-align: center;
            background: white;
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: #18a058;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .offline-icon::before {
            content: '📶';
            font-size: 2rem;
            filter: grayscale(1);
            opacity: 0.7;
        }

        .offline-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 60%;
            height: 3px;
            background: #ff4757;
            border-radius: 2px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.8rem;
            font-weight: 600;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .retry-button {
            background: #18a058;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .retry-button:hover {
            background: #16945d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(24, 160, 88, 0.3);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .status-text {
            font-size: 0.9rem;
            color: #95a5a6;
            margin-top: 1rem;
        }

        .features-list {
            text-align: left;
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .features-list h3 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .features-list ul {
            list-style: none;
        }

        .features-list li {
            color: #7f8c8d;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .features-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #18a058;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 2rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .features-list {
                text-align: center;
            }

            .features-list ul {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon"></div>
        <h1>인터넷 연결을 확인해주세요</h1>
        <p>현재 오프라인 상태입니다. 일부 기능이 제한될 수 있습니다.</p>
        
        <button class="retry-button" onclick="checkConnection()">
            연결 다시 시도
        </button>
        
        <div class="status-text" id="status">
            네트워크 상태를 확인하는 중...
        </div>

        <div class="features-list">
            <h3>오프라인에서도 사용 가능한 기능</h3>
            <ul>
                <li>최근 워크스페이스 목록 보기</li>
                <li>캐시된 프로젝트 파일 열람</li>
                <li>로컬 설정 변경</li>
                <li>오프라인 도움말 보기</li>
            </ul>
        </div>
    </div>

    <script>
        function updateStatus() {
            const status = document.getElementById('status');
            const button = document.querySelector('.retry-button');
            
            if (navigator.onLine) {
                status.textContent = '온라인 상태입니다. 앱으로 돌아갑니다...';
                status.style.color = '#18a058';
                button.style.background = '#18a058';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } else {
                status.textContent = '여전히 오프라인 상태입니다.';
                status.style.color = '#e74c3c';
            }
        }

        function checkConnection() {
            const button = document.querySelector('.retry-button');
            const status = document.getElementById('status');
            
            button.textContent = '확인 중...';
            button.disabled = true;
            status.textContent = '네트워크 연결을 확인하는 중...';
            status.style.color = '#95a5a6';
            
            setTimeout(() => {
                updateStatus();
                button.textContent = '연결 다시 시도';
                button.disabled = false;
            }, 1500);
        }

        // 네트워크 상태 변화 감지
        window.addEventListener('online', () => {
            updateStatus();
        });

        window.addEventListener('offline', () => {
            updateStatus();
        });

        // 초기 상태 확인
        updateStatus();
    </script>
</body>
</html>
