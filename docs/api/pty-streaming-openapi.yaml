openapi: 3.0.3
info:
  title: AICode Manager PTY Streaming API
  description: |
    PTY 세션 관리 및 WebSocket 스트리밍을 위한 REST API
    
    ## 주요 기능
    - Docker 컨테이너 내 PTY 세션 생성 및 관리
    - WebSocket을 통한 실시간 터미널 스트리밍
    - 터미널 스냅샷 및 재생
    - 플로우 제어 및 백프레셔 관리
    - 성능 최적화 및 모니터링
    
  version: 1.0.0
  contact:
    name: AICode Manager Team
    email: support@aicode.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: 개발 서버
  - url: https://api.aicode.io/v1
    description: 프로덕션 서버

tags:
  - name: PTY Sessions
    description: PTY 세션 관리
  - name: WebSocket
    description: WebSocket 스트리밍
  - name: Snapshots
    description: 터미널 스냅샷
  - name: Monitoring
    description: 모니터링 및 메트릭

paths:
  /pty/sessions:
    post:
      tags:
        - PTY Sessions
      summary: PTY 세션 생성
      description: Docker 컨테이너에서 새 PTY 세션을 생성합니다
      operationId: createPTYSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePTYSessionRequest'
      responses:
        '201':
          description: 세션 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTYSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    get:
      tags:
        - PTY Sessions
      summary: PTY 세션 목록 조회
      description: 활성 PTY 세션 목록을 조회합니다
      operationId: listPTYSessions
      parameters:
        - name: status
          in: query
          description: 세션 상태 필터
          schema:
            type: string
            enum: [active, idle, terminated]
        - name: container_id
          in: query
          description: 컨테이너 ID 필터
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PTYSession'

  /pty/sessions/{sessionId}:
    get:
      tags:
        - PTY Sessions
      summary: PTY 세션 상세 조회
      operationId: getPTYSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTYSession'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags:
        - PTY Sessions
      summary: PTY 세션 종료
      operationId: terminatePTYSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: 세션 종료 성공
        '404':
          $ref: '#/components/responses/NotFound'
    
    patch:
      tags:
        - PTY Sessions
      summary: PTY 세션 업데이트
      description: PTY 세션 설정을 업데이트합니다 (크기 조정 등)
      operationId: updatePTYSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePTYSessionRequest'
      responses:
        '200':
          description: 업데이트 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTYSession'
        '404':
          $ref: '#/components/responses/NotFound'

  /pty/sessions/{sessionId}/input:
    post:
      tags:
        - PTY Sessions
      summary: PTY 입력 전송
      description: PTY 세션으로 키보드 입력을 전송합니다
      operationId: sendPTYInput
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: 입력 데이터 (base64 인코딩)
      responses:
        '204':
          description: 입력 전송 성공
        '404':
          $ref: '#/components/responses/NotFound'

  /ws/stream/{sessionId}:
    get:
      tags:
        - WebSocket
      summary: WebSocket 스트리밍 연결
      description: |
        PTY 세션에 대한 WebSocket 연결을 설정합니다.
        
        **WebSocket 메시지 형식:**
        
        클라이언트 → 서버:
        ```json
        {
          "type": "input",
          "data": "base64_encoded_input"
        }
        ```
        
        서버 → 클라이언트:
        ```json
        {
          "type": "output",
          "data": "base64_encoded_output",
          "timestamp": "2024-01-01T12:00:00Z"
        }
        ```
      operationId: streamPTYSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '101':
          description: WebSocket 연결 업그레이드
        '404':
          $ref: '#/components/responses/NotFound'

  /snapshots:
    post:
      tags:
        - Snapshots
      summary: 터미널 스냅샷 생성
      operationId: createSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequest'
      responses:
        '201':
          description: 스냅샷 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
    
    get:
      tags:
        - Snapshots
      summary: 스냅샷 목록 조회
      operationId: listSnapshots
      parameters:
        - name: session_id
          in: query
          description: 세션 ID 필터
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snapshot'

  /snapshots/{snapshotId}:
    get:
      tags:
        - Snapshots
      summary: 스냅샷 조회
      operationId: getSnapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '404':
          $ref: '#/components/responses/NotFound'

  /metrics:
    get:
      tags:
        - Monitoring
      summary: 시스템 메트릭 조회
      operationId: getMetrics
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'

  /metrics/flow:
    get:
      tags:
        - Monitoring
      summary: 플로우 제어 메트릭 조회
      operationId: getFlowMetrics
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowMetrics'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: PTY 세션 ID
      schema:
        type: string
  
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  
  schemas:
    CreatePTYSessionRequest:
      type: object
      required:
        - container_id
      properties:
        container_id:
          type: string
          description: Docker 컨테이너 ID
        config:
          $ref: '#/components/schemas/PTYConfig'
    
    UpdatePTYSessionRequest:
      type: object
      properties:
        rows:
          type: integer
          description: 터미널 행 수
          minimum: 1
        cols:
          type: integer
          description: 터미널 열 수
          minimum: 1
        environment:
          type: object
          additionalProperties:
            type: string
          description: 환경 변수
    
    PTYConfig:
      type: object
      properties:
        rows:
          type: integer
          default: 24
          description: 터미널 행 수
        cols:
          type: integer
          default: 80
          description: 터미널 열 수
        term:
          type: string
          default: xterm-256color
          description: 터미널 타입
        shell:
          type: string
          default: /bin/bash
          description: 사용할 셸
        working_dir:
          type: string
          default: /
          description: 작업 디렉토리
        environment:
          type: object
          additionalProperties:
            type: string
          description: 환경 변수
    
    PTYSession:
      type: object
      properties:
        id:
          type: string
          description: 세션 ID
        container_id:
          type: string
          description: Docker 컨테이너 ID
        status:
          type: string
          enum: [active, idle, terminated]
          description: 세션 상태
        created_at:
          type: string
          format: date-time
          description: 생성 시간
        last_active:
          type: string
          format: date-time
          description: 마지막 활동 시간
        config:
          $ref: '#/components/schemas/PTYConfig'
        stats:
          type: object
          properties:
            bytes_read:
              type: integer
              format: int64
            bytes_written:
              type: integer
              format: int64
            idle_time:
              type: number
              format: float
              description: 유휴 시간 (초)
    
    CreateSnapshotRequest:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
          description: PTY 세션 ID
        format:
          type: string
          enum: [raw, compressed]
          default: compressed
          description: 스냅샷 형식
    
    Snapshot:
      type: object
      properties:
        id:
          type: string
          description: 스냅샷 ID
        session_id:
          type: string
          description: PTY 세션 ID
        timestamp:
          type: string
          format: date-time
          description: 스냅샷 생성 시간
        format:
          type: string
          enum: [raw, compressed]
          description: 스냅샷 형식
        size:
          type: integer
          format: int64
          description: 스냅샷 크기 (바이트)
        data:
          type: string
          description: 스냅샷 데이터 (base64 인코딩)
        metadata:
          type: object
          properties:
            rows:
              type: integer
            cols:
              type: integer
            cursor_row:
              type: integer
            cursor_col:
              type: integer
    
    SystemMetrics:
      type: object
      properties:
        active_sessions:
          type: integer
          description: 활성 세션 수
        total_sessions:
          type: integer
          format: int64
          description: 전체 세션 수
        active_connections:
          type: integer
          description: 활성 WebSocket 연결 수
        total_connections:
          type: integer
          format: int64
          description: 전체 연결 수
        memory_usage:
          type: integer
          format: int64
          description: 메모리 사용량 (바이트)
        cpu_usage:
          type: number
          format: float
          description: CPU 사용률 (0-1)
        uptime:
          type: integer
          format: int64
          description: 가동 시간 (초)
    
    FlowMetrics:
      type: object
      properties:
        connection_count:
          type: integer
          description: 연결 수
        average_backpressure:
          type: number
          format: float
          description: 평균 백프레셔 레벨
        throttled_connections:
          type: integer
          description: 스로틀링된 연결 수
        dropped_messages:
          type: integer
          format: int64
          description: 드롭된 메시지 수
        buffer_utilization:
          type: number
          format: float
          description: 버퍼 사용률 (0-1)
        system_throughput:
          type: number
          format: float
          description: 시스템 처리량 (bytes/sec)
    
    Error:
      type: object
      properties:
        code:
          type: string
          description: 오류 코드
        message:
          type: string
          description: 오류 메시지
        details:
          type: object
          description: 추가 오류 정보