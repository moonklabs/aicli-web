# Agent API Extensions for OpenAPI
# 기존 openapi.yaml에 추가할 Agent 관련 API 정의

paths:
  # 에이전트 관리 엔드포인트
  /agents:
    get:
      tags:
        - Agents
      summary: 에이전트 목록 조회
      description: 활성 에이전트 목록을 조회합니다
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
          description: 프로젝트 ID로 필터링
      responses:
        '200':
          description: 에이전트 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - Agents
      summary: 에이전트 생성
      description: 새로운 에이전트를 생성합니다
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: 에이전트 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}:
    get:
      tags:
        - Agents
      summary: 에이전트 조회
      description: ID로 특정 에이전트를 조회합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 에이전트 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Agents
      summary: 에이전트 수정
      description: 특정 에이전트의 정보를 수정합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: 에이전트 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Agents
      summary: 에이전트 삭제
      description: 특정 에이전트를 삭제합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '204':
          description: 에이전트 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/start:
    post:
      tags:
        - Agents
      summary: 에이전트 시작
      description: 특정 에이전트를 시작합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 에이전트 시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/stop:
    post:
      tags:
        - Agents
      summary: 에이전트 중지
      description: 특정 에이전트를 중지합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 에이전트 중지 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/restart:
    post:
      tags:
        - Agents
      summary: 에이전트 재시작
      description: 특정 에이전트를 재시작합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 에이전트 재시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/status:
    get:
      tags:
        - Agents
      summary: 에이전트 상태 조회
      description: 특정 에이전트의 현재 상태를 조회합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 에이전트 상태 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatusInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/health:
    get:
      tags:
        - Agents
      summary: 에이전트 헬스체크
      description: 특정 에이전트의 헬스 상태를 조회합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 헬스 상태 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/{id}/metrics:
    get:
      tags:
        - Agents
      summary: 에이전트 메트릭 조회
      description: 특정 에이전트의 메트릭을 조회합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '200':
          description: 메트릭 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/batch/start:
    post:
      tags:
        - Agents
      summary: 에이전트 일괄 시작
      description: 여러 에이전트를 한 번에 시작합니다
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAgentRequest'
      responses:
        '200':
          description: 일괄 시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /agents/batch/stop:
    post:
      tags:
        - Agents
      summary: 에이전트 일괄 중지
      description: 여러 에이전트를 한 번에 중지합니다
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAgentRequest'
      responses:
        '200':
          description: 일괄 중지 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # WebSocket 엔드포인트 (실제로는 HTTP GET으로 시작하여 업그레이드)
  /agents/{id}/logs/stream:
    get:
      tags:
        - Agents
      summary: 에이전트 로그 스트리밍
      description: WebSocket을 통해 특정 에이전트의 로그를 실시간으로 스트리밍합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
        - name: follow
          in: query
          schema:
            type: boolean
            default: true
          description: 실시간 팔로우 여부
        - name: tail
          in: query
          schema:
            type: integer
            default: 100
          description: 마지막 N개 라인
      responses:
        '101':
          description: WebSocket 프로토콜로 업그레이드
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{id}/events/stream:
    get:
      tags:
        - Agents
      summary: 에이전트 이벤트 스트리밍
      description: WebSocket을 통해 특정 에이전트의 이벤트를 실시간으로 스트리밍합니다
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 에이전트 ID
      responses:
        '101':
          description: WebSocket 프로토콜로 업그레이드
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/events/stream:
    get:
      tags:
        - Agents
      summary: 모든 에이전트 이벤트 스트리밍
      description: WebSocket을 통해 모든 에이전트의 이벤트를 실시간으로 스트리밍합니다
      security:
        - BearerAuth: []
      responses:
        '101':
          description: WebSocket 프로토콜로 업그레이드
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    # 에이전트 관련 스키마
    Agent:
      type: object
      properties:
        id:
          type: string
          example: "agent-123"
        name:
          type: string
          example: "my-agent"
        project_id:
          type: string
          example: "project-456"
        repository_url:
          type: string
          format: uri
          example: "https://github.com/user/repo.git"
        branch:
          type: string
          example: "main"
        status:
          $ref: '#/components/schemas/AgentStatus'
        docker_container_id:
          type: string
          example: "container-789"
        git_worktree_path:
          type: string
          example: "/workspaces/agent-123"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-01T12:00:00Z"
        last_activity_at:
          type: string
          format: date-time
          example: "2025-01-01T12:00:00Z"

    AgentStatus:
      type: string
      enum: [idle, starting, running, stopping, stopped, error]
      example: "running"

    CreateAgentRequest:
      type: object
      required:
        - name
        - repository_url
      properties:
        name:
          type: string
          example: "my-new-agent"
        project_id:
          type: string
          example: "project-456"
        repository_url:
          type: string
          format: uri
          example: "https://github.com/user/repo.git"
        branch:
          type: string
          default: "main"
          example: "main"
        description:
          type: string
          example: "Agent for processing user requests"

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
          example: "updated-agent-name"
        branch:
          type: string
          example: "develop"
        description:
          type: string
          example: "Updated description"

    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        count:
          type: integer
          example: 5

    AgentOperationResponse:
      type: object
      properties:
        message:
          type: string
          example: "에이전트가 시작되었습니다"
        agent_id:
          type: string
          example: "agent-123"

    AgentStatusInfo:
      type: object
      properties:
        agent_id:
          type: string
          example: "agent-123"
        status:
          $ref: '#/components/schemas/AgentStatus'
        container_status:
          type: string
          example: "running"
        uptime:
          type: string
          example: "2h 30m 15s"
        last_heartbeat:
          type: string
          format: date-time
          example: "2025-01-01T12:00:00Z"
        resource_usage:
          type: object
          properties:
            cpu_percent:
              type: number
              format: float
              example: 25.5
            memory_mb:
              type: integer
              example: 512
            disk_usage_mb:
              type: integer
              example: 1024

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-01T12:00:00Z"
        checks:
          type: object
          properties:
            container:
              type: string
              enum: [healthy, unhealthy]
              example: "healthy"
            git_worktree:
              type: string
              enum: [healthy, unhealthy]
              example: "healthy"
            claude_cli:
              type: string
              enum: [healthy, unhealthy]
              example: "healthy"

    AgentMetrics:
      type: object
      properties:
        agent_id:
          type: string
          example: "agent-123"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-01T12:00:00Z"
        cpu_usage:
          type: object
          properties:
            current_percent:
              type: number
              format: float
              example: 25.5
            average_percent:
              type: number
              format: float
              example: 22.3
            peak_percent:
              type: number
              format: float
              example: 45.2
        memory_usage:
          type: object
          properties:
            current_mb:
              type: integer
              example: 512
            limit_mb:
              type: integer
              example: 2048
            usage_percent:
              type: number
              format: float
              example: 25.0
        network_io:
          type: object
          properties:
            rx_bytes:
              type: integer
              example: 1024000
            tx_bytes:
              type: integer
              example: 512000
            rx_rate_bps:
              type: number
              format: float
              example: 1500.5
            tx_rate_bps:
              type: number
              format: float
              example: 750.2

    BatchAgentRequest:
      type: object
      required:
        - agent_ids
      properties:
        agent_ids:
          type: array
          items:
            type: string
          example: ["agent-123", "agent-456", "agent-789"]

    BatchOperationResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AgentOperationResult'
        count:
          type: integer
          example: 3

    AgentOperationResult:
      type: object
      properties:
        agent_id:
          type: string
          example: "agent-123"
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "에이전트가 성공적으로 시작되었습니다"
        error:
          type: string
          example: null

tags:
  - name: Agents
    description: AI 에이전트 관리 API